name: Southbound checks
on:
  push:
    branches: [feat/global-trip-foundations]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check budget-engine.js
          node --check route-budget.js
          node --check trip-calendar.js
          node --check route-timing.js
          node --check wait-costs.js
          node --check volunteer-matching.js
          node --check volunteer-economics.js
          node --check tests/volunteer-economics.test.cjs
          node --check itinerary.js
          node --check tests/budget-engine.test.cjs
          node --check tests/route-budget.test.cjs
          node --check tests/route-timing.test.cjs
          node --check tests/integration-assets.test.cjs
          node --check scripts/check-inline-scripts.cjs
          node --check tests/trip-calendar.test.cjs
          node --check tests/wait-costs.test.cjs
          node --check tests/volunteer-matching.test.cjs
          node scripts/check-inline-scripts.cjs
      - name: Run all node tests
        run: node --test tests/*.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
