name: Route engine checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          for file in route-engine.js itinerary.js transport-estimate.js savings-advice.js route-position.js dynamic-risk.js uncertainty.js price-history.js; do node --check "$file"; done
          for file in tests/*.test.cjs; do node --check "$file"; done
      - name: Unit tests
        run: node --test tests/*.test.cjs
