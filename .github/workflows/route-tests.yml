name: Route engine checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check route-engine.js
          node --check tests/route-engine.test.cjs
      - name: Unit tests
        run: node --test tests/*.test.cjs
