<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band &amp; Matte</title>
<meta name="theme-color" content="#2f6f63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Band &amp; Matte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Übersicht (Startkarte, Aufwärmen, Übungskarten) + Vollbild-Durchlauf mit Kopfzeile, Inhalt und fester Aktionsleiste */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#18201e; --muted:#5b6865; --line:#d5dcda;
  --mat:#2f6f63; --mat-strong:#2f6f63; --band:#e0532f; --cta:#d4461d; --band-soft:#fbe3db; --figure:#18201e; --floor:#b9c4c1; --on:#ffffff;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1b2321; --ink:#e7eeec; --muted:#9aa8a4; --line:#2c3735;
  --mat:#5fb3a2; --mat-strong:#25594f; --band:#ff7a55; --cta:#d4461d; --band-soft:#3a2219; --figure:#e7eeec; --floor:#3b4845; --on:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1b2321; --ink:#e7eeec; --muted:#9aa8a4; --line:#2c3735;
  --mat:#5fb3a2; --mat-strong:#25594f; --band:#ff7a55; --cta:#d4461d; --band-soft:#3a2219; --figure:#e7eeec; --floor:#3b4845; --on:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,8vw,2.8rem);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
header h1 span{color:var(--band)}
header p{margin:8px 0 0;color:var(--muted)}
button{font:inherit}
:focus-visible{outline:3px solid var(--band);outline-offset:2px}

/* Startkarte */
.start{background:var(--mat-strong);color:var(--on);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.start .eyebrow{opacity:.85}
.start h2{font-family:var(--f-display);font-weight:800;font-size:1.65rem;margin:0;line-height:1.1;text-wrap:balance}
.start p{margin:0;opacity:.92}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-weight:600;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--on);font-size:1.05rem;padding:12px 18px}
.btn.ghost{background:transparent;border-color:#ffffff70;color:var(--on)}
.btn.video{border-color:var(--band);color:var(--band)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.warn{background:var(--cta);border-color:var(--cta);color:var(--on)}

.days{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.days button{border:0;border-radius:10px;padding:10px 8px;background:transparent;color:var(--ink);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.days button b{font-family:var(--f-display);font-size:1.15rem}
.days button small{color:var(--muted);font-size:.8rem}
.days button[aria-pressed="true"]{background:var(--mat-strong);color:var(--on)}
.days button[aria-pressed="true"] small{color:var(--on);opacity:.8}

.warm{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.warm summary{cursor:pointer;font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wcard canvas{display:block;width:100%;height:auto;aspect-ratio:2/1.15;background:var(--bg);border-bottom:1px solid var(--line)}
.wcard div{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.wcard b{font-size:.92rem;line-height:1.25}
.wcard span{font-family:var(--f-mono);font-size:.75rem;color:var(--mat);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage{background:var(--bg);border-bottom:1px solid var(--line);position:relative}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:2/1.15;max-width:100%}
.stage .tag{position:absolute;top:10px;left:12px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.body{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.title h2{font-family:var(--f-display);font-weight:800;font-size:1.45rem;margin:0;line-height:1.1;text-wrap:balance}
.dose{font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--mat);font-variant-numeric:tabular-nums}
.muscles{display:flex;flex-wrap:wrap;gap:6px}
.muscles span{font-size:.8rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.band{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.band i{flex:none;width:26px;height:10px;border-radius:99px;border:3px solid var(--band);display:inline-block}
h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
ol,ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
ul.tips li::marker{color:var(--band)}
.prog{background:var(--band-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.prog b{color:var(--band)}

/* Durchlauf */
.session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.s-in{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px;min-width:0}
.s-top{background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.s-top .s-in{gap:8px}
.s-top .r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.s-phase{font-family:var(--f-mono);font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mat)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mat);transition:width .3s}
.s-main{flex:1;overflow-y:auto;padding-block:16px}
.s-bottom{background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.s-bottom .s-in{gap:8px}
.big-btn{width:100%;font-size:1.15rem;padding:16px}
.hint{text-align:center;font-size:.85rem;color:var(--muted);margin:0}
.s-canvas{display:block;width:100%;aspect-ratio:2/1.15;max-height:32vh;object-fit:contain;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.s-head{display:flex;flex-direction:column;gap:2px}
.s-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.05;margin:0;text-wrap:balance}
.s-head small{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:700}
.s-dose{font-family:var(--f-mono);font-weight:700;font-size:1.35rem;color:var(--band);font-variant-numeric:tabular-nums}
.how{margin:0;max-width:65ch}
.howto{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.howto summary{cursor:pointer;font-weight:600}
.howto[open] summary{margin-bottom:10px}
.howto h3{margin-top:12px}
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.tclock{font-family:var(--f-mono);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.tclock.run{color:var(--band)}
.tclock.lead{color:var(--muted)}
.tclock.end{color:var(--mat)}
.tlabel{font-size:.85rem;color:var(--muted);margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;font-family:var(--f-mono);font-weight:700;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ring{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:8px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:var(--line)}
.ring .prg{stroke:var(--band);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:clamp(2.6rem,12vw,3.4rem);font-variant-numeric:tabular-nums}
.p-title{text-align:center;display:flex;flex-direction:column;gap:2px}
.p-title h2{font-family:var(--f-display);font-weight:800;font-size:1.8rem;margin:0;line-height:1.1}
.p-title p{margin:0;color:var(--muted)}
.upnext{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.upnext canvas{width:120px;flex:none;aspect-ratio:2/1.15;background:var(--bg);border-radius:8px}
.upnext div{min-width:0;display:flex;flex-direction:column;gap:2px}
.upnext b{font-size:1.05rem;line-height:1.2}
.upnext span{font-family:var(--f-mono);font-size:.8rem;color:var(--mat)}
.gate-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.gate-list li{display:flex;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.gate-list span{font-family:var(--f-mono);font-size:.85rem;color:var(--mat);white-space:nowrap}
.finish{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:24px}
.finish .check{width:96px;height:96px;border-radius:50%;background:var(--mat-strong);color:var(--on);display:grid;place-items:center;font-size:3rem;font-weight:800}
.finish h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.6rem);margin:0;line-height:1.05}
.finish p{margin:0;max-width:40ch}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;align-items:center}
.stats b{font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap gut" id="overview">
  <header>
    <h1>Band <span>&amp;</span> Matte</h1>
    <p>Dein 2er-Split für jeden Tag: abwechselnd Tag A und Tag B, Aufwärmen plus 4 Zirkel-Runden.</p>
  </header>

  <section class="start" id="startCard" aria-live="polite"></section>

  <nav class="days" aria-label="Trainingstag wählen">
    <button id="dayA" type="button" data-day="A"><b>Tag A</b><small>Drücken + Beine vorne</small></button>
    <button id="dayB" type="button" data-day="B"><b>Tag B</b><small>Ziehen + hintere Kette</small></button>
  </nav>

  <details class="warm" open>
    <summary>Aufwärmen, 5–7 Minuten</summary>
    <div class="wgrid" id="wgrid"></div>
  </details>

  <div class="list" id="list"></div>
</div>

<div class="session" id="session" hidden>
  <div class="s-top gut"><div class="s-in">
    <div class="r"><span class="s-phase" id="sPhase"></span><button class="btn sm" id="sExit" type="button">Beenden</button></div>
    <div class="bar"><i id="sBar"></i></div>
  </div></div>
  <div class="s-main gut" id="sMain"><div class="s-in" id="sBody"></div></div>
  <div class="s-bottom gut"><div class="s-in" id="sFoot"></div></div>
</div>

<script>
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const ROUNDS = 4;

/* Posen: Seitenansicht in einem 200×115-Feld, Boden bei y=110.
   Joints: hd, sh, hp, kn, ft, el, ha  (+ optional el2, ha2, kn2, ft2 als hinteres Glied) */
const EX = {
 A:[
  {id:"pushup", name:"Liegestütze", dose:"8–15 Wdh.", muscles:["Brust","Schultern","Trizeps","Core"],
   band:"Mittel bis schwer, über den oberen Rücken", tag:"Seitenansicht",
   steps:["Hände etwas weiter als schulterbreit, Finger nach vorne.","Körper bildet eine Linie von Kopf bis Ferse, Po und Bauch fest.","Kontrolliert absenken, bis die Brust knapp über dem Boden ist.","Ellbogen zeigen schräg nach hinten, etwa 45° zum Körper.","Kräftig hochdrücken, oben die Schulterblätter auseinanderschieben."],
   tips:["Hüfte hängt durch oder ragt nach oben","Ellbogen stehen seitlich im 90°-Winkel ab","Kopf nickt zum Boden statt in Verlängerung der Wirbelsäule"],
   prog:"Zu schwer? Knie auf die Matte. Zu leicht? Band über den Rücken legen und die Enden unter den Händen fixieren, oder Füße erhöht aufs Sofa.",
   video:yt("Liegestütze richtig ausführen"), video2:yt("banded push up"),
   poses:[
    {hd:[178,62],sh:[165,70],hp:[110,86],kn:[80,96],ft:[30,108],el:[166,89],ha:[166,108]},
    {hd:[180,90],sh:[166,96],hp:[110,100],kn:[78,104],ft:[30,108],el:[146,101],ha:[166,108]}],
   bandPath:["ha","sh","hp"]},
  {id:"squat", name:"Kniebeugen mit Band", dose:"12–15 Wdh.", muscles:["Oberschenkel","Po","Adduktoren"],
   band:"Schwer, unter den Füßen und über den Schultern", tag:"Seitenansicht",
   steps:["Füße schulterbreit auf das Band, Zehen leicht nach außen.","Band mit beiden Händen vor den Schultern halten.","Hüfte nach hinten schieben und tief gehen, Brust bleibt aufrecht.","Knie zeigen in Richtung der Zehen.","Über die ganze Fußsohle hochdrücken, oben Po anspannen."],
   tips:["Knie fallen nach innen","Fersen heben ab","Runder Rücken im tiefsten Punkt"],
   prog:"Alternative: Loop knapp über den Knien und die Knie aktiv nach außen drücken. Steigerung: 3 Sekunden absenken, unten 1 Sekunde halten.",
   video:yt("Kniebeuge mit Widerstandsband"), video2:yt("resistance band squat form"),
   poses:[
    {hd:[103,14],sh:[100,26],hp:[100,62],kn:[103,86],ft:[100,110],el:[113,38],ha:[111,24]},
    {hd:[110,40],sh:[103,50],hp:[78,80],kn:[120,84],ft:[100,110],el:[118,62],ha:[115,49]}],
   bandPath:["ft","ha"]},
  {id:"spiderman", name:"Spiderman-Plank", dose:"30–45 s", timed:[30,45], muscles:["Schräge Bauchmuskeln","Gerader Bauch","Hüftbeuger","Schultern"],
   band:"Ohne Band", tag:"Seitenansicht",
   steps:["Unterarmstütz: Ellbogen unter den Schultern, Unterarme parallel auf der Matte.","Körper bildet eine Linie von Kopf bis Ferse, Po und Bauch fest.","Ein Knie seitlich außen Richtung Ellbogen ziehen, der Fuß schwebt knapp über der Matte.","Kurz halten, Bein zurück, dann die andere Seite.","Becken bleibt ruhig und sackt nicht durch, gleichmäßig weiteratmen."],
   tips:["Hüfte sackt durch, wenn ein Bein vorne ist","Po weit nach oben schieben","Hastig statt kontrolliert"],
   prog:"Fürs Knie: Wenn die Kniescheibe am Standbein zieht, kleinere Bewegungen machen oder kurz absetzen. Sticht es, abbrechen. Zu leicht? Langsamer und das Knie vorne 2 Sekunden halten.",
   video:yt("Spiderman Plank richtig ausführen"), video2:yt("spiderman plank form"),
   poses:[
    {hd:[176,78],sh:[162,85],hp:[108,90],kn:[70,98],ft:[30,107],kn2:[70,98],ft2:[30,107],el:[162,108],ha:[186,108]},
    {hd:[176,78],sh:[162,85],hp:[110,88],kn:[136,94],ft:[100,100],kn2:[70,98],ft2:[30,107],el:[162,108],ha:[186,108]}],
   bandPath:null}
 ],
 B:[
  {id:"row", name:"Rudern sitzend mit Band", dose:"12–15 Wdh.", muscles:["Oberer Rücken","Latissimus","Bizeps","Hintere Schulter"],
   band:"Mittel bis schwer, um die Fußsohlen", tag:"Seitenansicht",
   steps:["Aufrecht auf die Matte setzen, Beine gestreckt oder leicht gebeugt.","Band um die Fußsohlen legen, Enden greifen.","Ellbogen eng am Körper nach hinten ziehen.","Am Ende Schulterblätter zusammendrücken, kurz halten.","Langsam nach vorne zurückgeben, ohne einzusacken."],
   tips:["Mit dem Oberkörper nach hinten schwingen","Schultern ziehen Richtung Ohren","Rundrücken"],
   prog:"Steigerung: Band doppelt nehmen oder enger greifen. 2 Sekunden Halten am Ende jeder Wiederholung.",
   video:yt("Rudern sitzend Widerstandsband"), video2:yt("seated band row form"),
   poses:[
    {hd:[70,47],sh:[66,60],hp:[66,104],kn:[110,102],ft:[152,103],el:[96,74],ha:[124,82]},
    {hd:[66,47],sh:[63,60],hp:[66,104],kn:[110,102],ft:[152,103],el:[42,80],ha:[72,78]}],
   bandPath:["ha","ft"]},
  {id:"bridge", name:"Glute Bridge mit Band", dose:"15–20 Wdh.", muscles:["Po","Beinbeuger","Unterer Rücken"],
   band:"Mittel, als Loop knapp über den Knien", tag:"Seitenansicht",
   steps:["Rückenlage, Füße hüftbreit aufgestellt, nah am Po.","Loop knapp über den Knien, Knie leicht nach außen drücken.","Über die Fersen die Hüfte hochschieben.","Oben bilden Knie, Hüfte und Schultern eine Linie. Po 2 Sekunden fest anspannen.","Langsam absenken, Po berührt kaum den Boden."],
   tips:["Hohlkreuz statt Po-Spannung","Knie fallen nach innen","Zu weit entfernte Füße"],
   prog:"Steigerung: einbeinig ausführen oder Schultern auf der Sofakante ablegen (Hip Thrust).",
   video:yt("Glute Bridge mit Band richtig"), video2:yt("banded glute bridge form"),
   poses:[
    {hd:[30,103],sh:[50,104],hp:[106,104],kn:[134,76],ft:[150,108],el:[74,107],ha:[96,107]},
    {hd:[30,103],sh:[50,104],hp:[106,76],kn:[140,68],ft:[150,108],el:[74,107],ha:[96,107]}],
   bandPath:"ring"},
  {id:"deadbug", name:"Dead Bug", dose:"8–12 pro Seite", muscles:["Tiefe Bauchmuskeln","Hüftbeuger","Koordination"],
   band:"Optional leichtes Band zwischen Händen und Füßen", tag:"Seitenansicht",
   steps:["Rückenlage, Arme senkrecht nach oben, Hüfte und Knie im 90°-Winkel.","Unteren Rücken aktiv in die Matte drücken.","Einen Arm nach hinten und das gegenüberliegende Bein nach vorne strecken.","Nur so weit, wie der Rücken am Boden bleibt.","Zurück in die Ausgangsposition, dann Seite wechseln."],
   tips:["Unterer Rücken hebt sich ab","Zu schnell und schwungvoll","Kopf und Nacken angespannt"],
   prog:"Steigerung: langsamer (3 Sekunden strecken) oder ein leichtes Band zwischen Händen und Füßen, das dem Strecken Widerstand gibt.",
   video:yt("Dead Bug Übung richtig"), video2:yt("dead bug exercise form"),
   poses:[
    {hd:[40,101],sh:[58,104],hp:[114,104],kn:[114,76],ft:[140,76],el:[60,86],ha:[60,68],el2:[60,86],ha2:[60,68],kn2:[114,76],ft2:[140,76]},
    {hd:[40,101],sh:[58,104],hp:[114,104],kn:[146,98],ft:[180,101],el:[42,94],ha:[22,98],el2:[60,86],ha2:[60,68],kn2:[114,76],ft2:[140,76]}],
   bandPath:null}
 ]
};

const STAND = {hd:[100,22],sh:[100,34],hp:[100,68],kn:[97,89],ft:[96,110],kn2:[103,89],ft2:[104,110]};

/* ---------- Speicher & Tag-Logik ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const DAYS = {A:"Drücken + Beine vorne", B:"Ziehen + hintere Kette"};
const other = d => d==="A" ? "B" : "A";
function localDate(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function niceDate(iso){try{return new Date(iso+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"numeric"})}catch(e){return iso}}
const today = localDate();
let last = store.get("bm-last", null);            // {date, day} des zuletzt abgeschlossenen Trainings
let S = store.get("bm-session", null);            // laufender Durchlauf
if(S && S.date !== today){ S = null; store.set("bm-session", null); }
function autoDay(){ if(!last) return "A"; return last.date === today ? last.day : other(last.day); }
let day = S ? S.day : autoDay();

/* ---------- Übersicht ---------- */
const list = document.getElementById("list"), startCard = document.getElementById("startCard");
function renderStart(){
  const doneToday = last && last.date === today && last.day === day;
  const resumable = S && S.day === day;
  let eyebrow, text;
  if(resumable){ eyebrow = "Training läuft"; text = "Du hast heute schon angefangen. Mach da weiter, wo du aufgehört hast."; }
  else if(doneToday){ eyebrow = "Heute erledigt ✓"; text = `Stark. Morgen ist Tag ${other(day)} dran, die App zeigt ihn dann automatisch an.`; }
  else if(day === autoDay()){ eyebrow = "Heute dran"; text = last ? `Zuletzt: Tag ${last.day} am ${niceDate(last.date)}.` : "Ca. 30 Minuten: Aufwärmen, dann 4 Runden Zirkel."; }
  else { eyebrow = "Manuell gewählt"; text = `Laut Plan wäre heute Tag ${autoDay()} dran.`; }
  startCard.innerHTML = `
    <span class="eyebrow">${eyebrow}</span>
    <h2>Tag ${day} · ${DAYS[day]}</h2>
    <p>${text}</p>
    <div class="row">${resumable
      ? `<button class="btn primary" id="btnResume" type="button">Weitermachen</button><button class="btn ghost" id="btnRestart" type="button">Neu starten</button>`
      : `<button class="btn ${doneToday?'ghost':'primary'}" id="btnStart" type="button">${doneToday?'Nochmal trainieren':'Training starten'}</button>`}</div>`;
  const b1=document.getElementById("btnStart"), b2=document.getElementById("btnResume"), b3=document.getElementById("btnRestart");
  if(b1) b1.onclick = () => startSession(false);
  if(b2) b2.onclick = () => startSession(true);
  if(b3) b3.onclick = () => startSession(false);
}
function render(){
  document.querySelectorAll(".days button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.day===day)));
  renderStart();
  list.innerHTML = "";
  EX[day].forEach((ex,i)=>{
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="stage"><span class="tag">Station ${i+1} von 3 · ${ex.tag}</span><canvas width="400" height="230" aria-label="Animation: ${ex.name}" role="img"></canvas></div>
      <div class="body">
        <div class="title"><h2>${ex.name}</h2><span class="dose">pro Runde: ${ex.dose}</span></div>
        <div class="muscles">${ex.muscles.map(m=>`<span>${m}</span>`).join("")}</div>
        <div class="band"><i aria-hidden="true"></i>${ex.band}</div>
        <div><h3>So geht's</h3><ol>${ex.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
        <div><h3>Typische Fehler</h3><ul class="tips">${ex.tips.map(s=>`<li>${s}</li>`).join("")}</ul></div>
        <div class="prog"><b>Leichter oder schwerer:</b> ${ex.prog}</div>
        <div class="row">
          <a class="btn video" href="${ex.video}" target="_blank" rel="noopener">▶ Videos</a>
          <a class="btn" href="${ex.video2}" target="_blank" rel="noopener">EN</a>
        </div>
      </div>`;
    list.appendChild(card);
    animate(card.querySelector("canvas"), ex);
  });
}
document.querySelectorAll(".days button").forEach(b=>b.addEventListener("click",()=>{day=b.dataset.day;render()}));

/* ---------- Strichfiguren-Animation ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const anims = [];
function colors(){const c=getComputedStyle(document.documentElement);return {mat:c.getPropertyValue("--mat").trim(),floor:c.getPropertyValue("--floor").trim(),band:c.getPropertyValue("--band").trim(),fig:c.getPropertyValue("--figure").trim()}}
function animate(cv, ex){
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = 400*dpr; cv.height = 230*dpr;
  const a = {cv,ctx,ex,dpr}; anims.push(a);
  if(reduce) draw(a,0,0,colors());
}
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]}
function draw(a, t, ph, C){
  const {ctx,ex,dpr} = a, p0 = ex.poses[0], p1 = ex.poses[1]||p0;
  const P = {}; for(const k in p0) P[k] = lerp(p0[k], p1[k]||p0[k], t);
  if(ex.circle){ const g = ph*2*Math.PI;
    P.ha=[P.sh[0]+30*Math.sin(g), P.sh[1]-30*Math.cos(g)]; P.el=[P.sh[0]+15*Math.sin(g), P.sh[1]-15*Math.cos(g)]; }
  const s = 2*dpr, X = p => p[0]*s, Y = p => p[1]*s;
  ctx.clearRect(0,0,a.cv.width,a.cv.height);
  ctx.fillStyle = C.mat; ctx.globalAlpha=.25;
  ctx.fillRect(14*s,110*s,172*s,3*s); ctx.globalAlpha=1;
  ctx.strokeStyle = C.floor; ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.moveTo(4*s,113*s); ctx.lineTo(196*s,113*s); ctx.stroke();
  const paths = (!ex.bandPath || ex.bandPath==="ring") ? [] : (Array.isArray(ex.bandPath[0]) ? ex.bandPath : [ex.bandPath]);
  ctx.strokeStyle = C.band; ctx.lineWidth = 2.2*s;
  paths.forEach(path=>{ ctx.beginPath(); path.forEach((k,i)=>{const p=P[k]; i?ctx.lineTo(X(p),Y(p)):ctx.moveTo(X(p),Y(p))}); ctx.stroke(); });
  const back = ex.front ? 1 : .35;
  const limb = (pts, alpha, w) => {ctx.globalAlpha=alpha; ctx.strokeStyle=C.fig; ctx.lineWidth=w*s; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(p),Y(p)):ctx.moveTo(X(p),Y(p))); ctx.stroke(); ctx.globalAlpha=1;};
  if(P.ha2) limb([P.sh,P.el2,P.ha2], back, 5);
  if(P.ft2) limb([P.hp,P.kn2,P.ft2], back, 5.5);
  limb([P.hp,P.kn,P.ft], 1, 5.5);
  if(P.mid){ const c=[2*P.mid[0]-(P.sh[0]+P.hp[0])/2, 2*P.mid[1]-(P.sh[1]+P.hp[1])/2];
    ctx.strokeStyle=C.fig; ctx.lineWidth=6.5*s; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(X(P.sh),Y(P.sh)); ctx.quadraticCurveTo(X(c),Y(c),X(P.hp),Y(P.hp)); ctx.stroke(); }
  else limb([P.sh,P.hp], 1, 6.5);
  limb([P.sh,P.el,P.ha], 1, 5);
  if(ex.bandPath==="ring"){ ctx.strokeStyle=C.band; ctx.lineWidth=2.2*s;
    ctx.beginPath(); ctx.ellipse(X(lerp(P.hp,P.kn,.82)),Y(lerp(P.hp,P.kn,.82)),4*s,7*s,0,0,Math.PI*2); ctx.stroke(); }
  ctx.fillStyle = C.fig; ctx.beginPath(); ctx.arc(X(P.hd),Y(P.hd),7*s,0,Math.PI*2); ctx.fill();
}
const t0 = performance.now();
function loop(now){
  for(let i=anims.length-1;i>=0;i--) if(!anims[i].cv.isConnected) anims.splice(i,1);
  const C = colors();
  anims.forEach(a=>{
    if(a.cv.getClientRects().length===0) return;   // versteckt: nicht zeichnen
    const ph = ((now - t0)/(a.ex.dur||2600)) % 1;
    draw(a, (1 - Math.cos(ph*2*Math.PI))/2, ph, C);
  });
  requestAnimationFrame(loop);
}

/* ---------- Ton, Vibration, Bildschirm wach halten ---------- */
let actx = null, wake = null;
function unlockAudio(){try{actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.resume) actx.resume()}catch(e){}}
function tone(freq, dur, at=0, vol=.22){try{if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+at;
  o.frequency.value=freq; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.start(t); o.stop(t+dur)}catch(e){}}
const tick = () => tone(660,.09);
const gong = () => { tone(880,.22,0); tone(880,.22,.28); tone(1175,.4,.56); try{navigator.vibrate && navigator.vibrate([200,100,200])}catch(e){} };
async function keepAwake(){try{if("wakeLock" in navigator && !wake){wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null})}}catch(e){}}
function letSleep(){try{wake && wake.release()}catch(e){} wake=null}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !sessionEl.hidden) keepAwake(); });

/* ---------- Geführter Durchlauf ---------- */
const sessionEl = document.getElementById("session"), overview = document.getElementById("overview");
const sPhase = document.getElementById("sPhase"), sBar = document.getElementById("sBar"), sBody = document.getElementById("sBody"), sFoot = document.getElementById("sFoot"), sMain = document.getElementById("sMain"), sExit = document.getElementById("sExit");
let steps = [], iv = null, exitArm = null;
const WARM_N = WARM.length + 2;

function buildSteps(d){
  const s = []; let w = 0;
  WARM.forEach(ex => s.push({kind:"ex", phase:"warm", ex, w:++w}));
  s.push({kind:"ex", phase:"warm", ex:LATERAL, w:++w, set:1});
  s.push({kind:"pause", sec:20, title:"Kurze Pause", sub:"Gleich kommt Satz 2"});
  s.push({kind:"ex", phase:"warm", ex:LATERAL, w:++w, set:2});
  s.push({kind:"gate"});
  for(let r=1; r<=ROUNDS; r++){
    EX[d].forEach((ex,i)=>{
      s.push({kind:"ex", phase:"main", ex, round:r, pos:i});
      if(i < EX[d].length-1) s.push({kind:"pause", sec:20, title:"Wechsel", sub:"20 Sekunden zum Umbauen"});
      else if(r < ROUNDS) s.push({kind:"pause", sec:120, title:"Rundenpause", sub:`Runde ${r} von ${ROUNDS} geschafft`});
    });
  }
  s.push({kind:"finish"});
  return s;
}
const nextEx = i => { for(let j=i+1;j<steps.length;j++){ if(steps[j].kind==="ex") return steps[j]; if(steps[j].kind!=="pause") return null; } return null; };
const saveS = () => store.set("bm-session", S);

function startSession(resume){
  unlockAudio();
  if(!resume || !S) S = {date:today, day, idx:0, startedAt:Date.now(), pauseEnd:null};
  steps = buildSteps(S.day);
  saveS();
  overview.hidden = true; sessionEl.hidden = false;
  keepAwake();
  show();
}
function go(i){ clearInterval(iv); iv=null; S.idx=i; S.pauseEnd=null; saveS(); show(); }
function next(){ go(S.idx+1); }
function closeSession(){
  clearInterval(iv); iv=null; letSleep();
  sessionEl.hidden = true; overview.hidden = false;
  render(); window.scrollTo(0,0);
}
sExit.onclick = () => {
  if(exitArm){ clearTimeout(exitArm); exitArm=null; S=null; store.set("bm-session",null); closeSession(); return; }
  sExit.textContent = "Wirklich beenden?"; sExit.classList.add("warn");
  exitArm = setTimeout(()=>{ exitArm=null; sExit.textContent="Beenden"; sExit.classList.remove("warn"); }, 3000);
};

function show(){
  const st = steps[S.idx];
  sBar.style.width = Math.round(S.idx/(steps.length-1)*100) + "%";
  sMain.scrollTop = 0;
  sExit.hidden = st.kind==="finish";
  if(exitArm){ clearTimeout(exitArm); exitArm=null; sExit.textContent="Beenden"; sExit.classList.remove("warn"); }
  if(st.kind==="ex") showEx(st);
  else if(st.kind==="pause") showPause(st);
  else if(st.kind==="gate") showGate();
  else showFinish();
}

function phaseLabel(st){
  return st.phase==="warm" ? `Aufwärmen · ${st.w} von ${WARM_N}` : `Runde ${st.round} von ${ROUNDS} · Übung ${st.pos+1} von 3`;
}

function showEx(st){
  const ex = st.ex, main = st.phase==="main";
  sPhase.textContent = phaseLabel(st);
  const t = ex.timed;
  sBody.innerHTML = `
    <canvas class="s-canvas" role="img" aria-label="Animation: ${ex.name}"></canvas>
    <div class="s-head">
      ${st.set ? `<small>Satz ${st.set} von 2</small>` : ""}
      <h2>${ex.name}</h2>
      <div class="s-dose">${ex.dose}</div>
    </div>
    ${t ? `<div class="tbox">
      ${t.length>1 ? `<div class="chips" role="group" aria-label="Dauer">${t.map(v=>`<button class="chip" type="button" data-sec="${v}">${v} s</button>`).join("")}</div>` : ""}
      <div class="tclock" id="tClock">0:${String(t[0]).padStart(2,"0")}</div>
      <p class="tlabel" id="tLabel">Starte den Timer, wenn du in Position bist.</p>
      <button class="btn" id="tBtn" type="button">▶ Timer starten</button>
    </div>` : ""}
    ${main ? `<div class="band"><i aria-hidden="true"></i>${ex.band}</div>
      <details class="howto"><summary>Anleitung und typische Fehler</summary>
        <ol>${ex.steps.map(x=>`<li>${x}</li>`).join("")}</ol>
        <h3>Typische Fehler</h3><ul class="tips">${ex.tips.map(x=>`<li>${x}</li>`).join("")}</ul>
      </details>` : `<p class="how">${ex.how}</p>`}`;
  animate(sBody.querySelector("canvas"), ex);

  const nx = steps[S.idx+1];
  let hint = "";
  if(nx.kind==="pause") { const n = nextEx(S.idx); hint = `Danach ${nx.sec>=60 ? "2 Minuten Rundenpause" : "20 s Pause"}${n ? `, dann ${n.ex.name}` : ""}.`; }
  else if(nx.kind==="gate") hint = "Danach ist das Aufwärmen geschafft.";
  else if(nx.kind==="finish") hint = "Letzte Übung des Tages!";
  else hint = `Danach: ${nx.ex.name}`;
  sFoot.innerHTML = `<button class="btn primary big-btn" id="doneBtn" type="button">Fertig ✓</button><p class="hint">${hint}</p>`;
  document.getElementById("doneBtn").onclick = next;

  if(t) setupTimer(t, ex);
}

/* Timer für Übungen auf Zeit: 3 s Vorlauf, dann Countdown */
function setupTimer(opts, ex){
  const clock = document.getElementById("tClock"), label = document.getElementById("tLabel"), btn = document.getElementById("tBtn");
  const key = "bm-sec-" + (ex.id || ex.name);
  let target = store.get(key, opts[0]); if(!opts.includes(target)) target = opts[0];
  let end = 0, lastShown = null;
  const fmt = n => Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
  const chips = sBody.querySelectorAll(".chip");
  const markChips = () => chips.forEach(c=>c.setAttribute("aria-pressed", String(+c.dataset.sec===target)));
  const reset = () => { clearInterval(iv); iv=null; clock.className="tclock"; clock.textContent=fmt(target); label.textContent="Starte den Timer, wenn du in Position bist."; btn.textContent="▶ Timer starten"; };
  chips.forEach(c=>c.onclick=()=>{ target=+c.dataset.sec; store.set(key,target); markChips(); reset(); });
  markChips(); reset();
  btn.onclick = () => {
    if(iv){ reset(); return; }
    unlockAudio();
    end = Date.now() + (target+3)*1000; lastShown = null;
    btn.textContent = "■ Stopp";
    const step = () => {
      const left = Math.ceil((end-Date.now())/1000);
      if(left === lastShown) return; lastShown = left;
      if(left > target){ const lead = left-target; clock.className="tclock lead"; clock.textContent = String(lead); label.textContent="Bereit machen …"; tick(); }
      else if(left > 0){ clock.className="tclock run"; clock.textContent = fmt(left); label.textContent="Läuft. Halte durch!"; if(left===target) tone(880,.15); if(left<=3) tick(); }
      else { clearInterval(iv); iv=null; clock.className="tclock end"; clock.textContent="Zeit!"; label.textContent="Geschafft. Tippe auf „Fertig“."; btn.textContent="↻ Nochmal"; gong();
        const d=document.getElementById("doneBtn"); if(d) d.classList.add("pulse"); }
    };
    step(); iv = setInterval(step, 100);
  };
}

function showPause(st){
  const n = nextEx(S.idx);
  sPhase.textContent = st.sec>=60 ? "Rundenpause" : "Pause";
  if(!S.pauseEnd){ S.pauseEnd = Date.now() + st.sec*1000; saveS(); }
  const R = 52, C = 2*Math.PI*R;
  sBody.innerHTML = `
    <div class="p-title"><h2>${st.title}</h2><p>${st.sub||""}</p></div>
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="${R}"/><circle class="prg" id="pRing" cx="60" cy="60" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num" id="pNum" role="timer"></div></div>
    ${n ? `<div class="upnext"><canvas role="img" aria-label="Animation: ${n.ex.name}"></canvas><div><span class="eyebrow" style="color:var(--muted)">Als Nächstes</span><b>${n.ex.name}</b><span>${n.ex.dose}${n.round?` · Runde ${n.round}`:""}</span></div></div>` : ""}`;
  if(n) animate(sBody.querySelector(".upnext canvas"), n.ex);
  sFoot.innerHTML = `<div class="row" style="justify-content:center"><button class="btn" id="pPlus" type="button">+20 s</button><button class="btn primary" id="pSkip" type="button">Pause überspringen</button></div>`;
  document.getElementById("pPlus").onclick = () => { S.pauseEnd += 20000; saveS(); lastP=null; upd(); };
  document.getElementById("pSkip").onclick = next;
  const num = document.getElementById("pNum"), ring = document.getElementById("pRing");
  let lastP = null;
  function upd(){
    const ms = S.pauseEnd - Date.now(), left = Math.max(0, Math.ceil(ms/1000));
    const full = Math.max(st.sec*1000, ms);
    ring.style.strokeDashoffset = String(C * (1 - Math.max(0,ms)/full));
    if(left === lastP) return; lastP = left;
    num.textContent = Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    if(left>0 && left<=3) tick();
    if(left===0){ clearInterval(iv); iv=null; gong(); setTimeout(next, 400); }
  }
  upd(); if(S.pauseEnd > Date.now()) iv = setInterval(upd, 100);
}

function showGate(){
  sPhase.textContent = "Aufwärmen geschafft";
  sBody.innerHTML = `
    <div class="p-title"><h2>Bereit für den Zirkel?</h2><p>Tag ${S.day} · ${DAYS[S.day]}</p></div>
    <ul class="gate-list">${EX[S.day].map(e=>`<li><b>${e.name}</b><span>${e.dose}</span></li>`).join("")}</ul>
    <p class="hint">${ROUNDS} Runden. Nach jeder Übung 20 s Pause, nach jeder Runde 2 Minuten. Die Pausen laufen automatisch.</p>`;
  sFoot.innerHTML = `<button class="btn primary big-btn" id="gateGo" type="button">Zirkel starten</button>`;
  document.getElementById("gateGo").onclick = () => { unlockAudio(); next(); };
}

function showFinish(){
  sPhase.textContent = "Training abgeschlossen";
  sBar.style.width = "100%";
  const mins = Math.max(1, Math.round((Date.now() - S.startedAt)/60000));
  const doneDay = S.day;
  last = {date:today, day:doneDay}; store.set("bm-last", last);
  const hist = store.get("bm-history", {}); hist[today] = doneDay; store.set("bm-history", hist);
  const total = Object.keys(hist).length;
  S = null; store.set("bm-session", null); letSleep(); gong();
  sBody.innerHTML = `
    <div class="finish">
      <div class="check" aria-hidden="true">✓</div>
      <h2>Geschafft!</h2>
      <p>Tag ${doneDay} ist abgeschlossen. Morgen ist <b>Tag ${other(doneDay)} · ${DAYS[other(doneDay)]}</b> dran, die App zeigt ihn automatisch an.</p>
      <div class="stats">
        <div><b>${ROUNDS}</b><span>Runden</span></div>
        <div><b>${mins}</b><span>Minuten</span></div>
        <div><b>${total}</b><span>Trainingstage</span></div>
      </div>
    </div>`;
  sFoot.innerHTML = `<button class="btn primary big-btn" id="finBtn" type="button">Zur Übersicht</button>`;
  document.getElementById("finBtn").onclick = () => { day = doneDay; closeSession(); };
}

/* ---------- Start ---------- */
const wgrid = document.getElementById("wgrid");
[...WARM, {...LATERAL, dose:"2 × 12–15"}].forEach(w=>{
  const el = document.createElement("div"); el.className="wcard";
  el.innerHTML = `<canvas width="400" height="230" role="img" aria-label="Animation: ${w.name}"></canvas><div><b>${w.name}</b><span>${w.dose}</span></div>`;
  wgrid.appendChild(el); animate(el.querySelector("canvas"), w);
});
render();
if(!reduce) requestAnimationFrame(loop);

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>

</body>
